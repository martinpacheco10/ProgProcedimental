<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bulma CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <title>Formulario Empleados</title>

    <style>
        body {
            background-color: #f4f6f9;
        }

        .caja-formulario {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 700px;
            margin: auto;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.1);
        }

        .title {
            color: #3273dc;
        }

        .button {
            margin-top: 10px;
        }

        .input:focus,
        .textarea:focus,
        .select select:focus {
            border-color: #3273dc;
            box-shadow: 0 0 5px rgba(50, 115, 220, 0.3);
        }
    </style>

</head>

<body>

    <section class="section">

        <div class="caja-formulario">

            <h1 class="title has-text-centered">
                <i class="fas fa-user"></i>
                Registro de Empleados
            </h1>

            <!-- Nombre -->
            <div class="field">
                <label class="label">Nombre</label>

                <div class="control has-icons-left">
                    <input class="input" type="text" placeholder="Ingrese nombre">

                    <span class="icon is-left">
                        <i class="fas fa-user"></i>
                    </span>
                </div>
            </div>

            <!-- Apellido -->
            <div class="field">
                <label class="label">Apellido</label>

                <div class="control has-icons-left">
                    <input class="input" type="text" placeholder="Ingrese apellido">

                    <span class="icon is-left">
                        <i class="fas fa-user-tag"></i>
                    </span>
                </div>
            </div>

            <!-- Tipo Documento -->
            <div class="field">
                <label class="label">Tipo de Documento</label>

                <div class="control">
                    <div class="select is-fullwidth">
                        <select>
                            <option>Seleccione tipo</option>
                            <option>Cédula</option>
                            <option>Tarjeta de Identidad</option>
                            <option>Pasaporte</option>
                            <option>Cédula Extranjera</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Número Documento -->
            <div class="field">
                <label class="label">Número de Documento</label>

                <div class="control has-icons-left">
                    <input class="input" type="number" placeholder="Ingrese número">

                    <span class="icon is-left">
                        <i class="fas fa-id-card"></i>
                    </span>
                </div>
            </div>

            <!-- Teléfono -->
            <div class="field">
                <label class="label">Teléfono</label>

                <div class="control has-icons-left">
                    <input class="input" type="tel" placeholder="Ingrese teléfono">

                    <span class="icon is-left">
                        <i class="fas fa-phone"></i>
                    </span>
                </div>
            </div>

            <!-- Correo -->
            <div class="field">
                <label class="label">Correo Electrónico</label>

                <div class="control has-icons-left">
                    <input class="input" type="email" placeholder="Ingrese correo">

                    <span class="icon is-left">
                        <i class="fas fa-envelope"></i>
                    </span>
                </div>
            </div>

            <!-- Género -->
            <div class="field">
                <label class="label">Género</label>

                <div class="control">
                    <div class="select is-fullwidth">
                        <select>
                            <option>Seleccione género</option>
                            <option>Masculino</option>
                            <option>Femenino</option>
                            <option>Otro</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Cargo -->
            <div class="field">
                <label class="label">Cargo</label>

                <div class="control has-icons-left">
                    <input class="input" type="text" placeholder="Ingrese cargo">

                    <span class="icon is-left">
                        <i class="fas fa-briefcase"></i>
                    </span>
                </div>
            </div>

            <!-- Fecha Nacimiento -->
            <div class="field">
                <label class="label">Fecha de Nacimiento</label>

                <div class="control has-icons-left">
                    <input class="input" type="date">

                    <span class="icon is-left">
                        <i class="fas fa-calendar"></i>
                    </span>
                </div>
            </div>

            <!-- Contraseña -->
            <div class="field">
                <label class="label">Contraseña</label>

                <div class="control has-icons-left">
                    <input class="input" type="password" placeholder="Ingrese contraseña">

                    <span class="icon is-left">
                        <i class="fas fa-lock"></i>
                    </span>
                </div>
            </div>

            <!-- Botón Guardar -->
            <div class="field">
                <div class="control">
                    <button class="button is-link is-fullwidth">
                        <i class="fas fa-save"></i>
                        &nbsp; Guardar Empleado
                    </button>
                </div>
            </div>

            <!-- Botón Limpiar -->
            <div class="field">
                <div class="control">
                    <button type="reset" class="button is-light is-fullwidth">
                        <i class="fas fa-eraser"></i>
                        &nbsp; Limpiar
                    </button>
                </div>
            </div>

        </div>

    </section>

</body>

</html>
